name: Browser tests (iPhone Safari + Android Chrome)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Playwright image: WebKit and Chromium come preinstalled (installing them on the runner can hang)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run smoke test and accessibility check (WCAG 2.2 AA + keyboard)
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4173/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          SMOKE_URL=http://127.0.0.1:4173/ node tests/browser/smoke.mjs
          E2E_URL=http://127.0.0.1:4173/ E2E_OUT=smoke-results node tests/e2e/a11y.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: smoke-results/
          retention-days: 14
