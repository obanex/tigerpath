name: Fetch OpenStreetMap data

# Downloads real walkways, building footprints, parking and emergency phones for
# campus from OpenStreetMap. Run it from the Actions tab, or let it refresh monthly.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-osm -- --raw
      - uses: actions/upload-artifact@v4
        with:
          name: osm-data
          path: |
            public/data/osm-campus.json
            osm-raw.json
          retention-days: 7
