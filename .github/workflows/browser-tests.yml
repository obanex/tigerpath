name: Browser tests (iPhone Safari + Android Chrome)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run build
      - name: Run smoke test
        run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on -t 30000 http://localhost:4173/ 2>/dev/null || sleep 5
          node tests/browser/smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: smoke-results/
          retention-days: 14
